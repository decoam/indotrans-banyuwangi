<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d060" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#997819" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1f2e" />
      <stop offset="100%" stop-color="#07090d" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Diamond / Shield -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="url(#darkGrad)" stroke="url(#goldGrad)" stroke-width="3" />
  
  <!-- Inner Glow Ring -->
  <rect x="14" y="14" width="72" height="72" rx="16" stroke="#d4af37" stroke-width="1" stroke-opacity="0.3" fill="none" />
  
  <!-- Stylized Monogram "IT" / Compass needle in Gold -->
  <path d="M50 22 L72 68 L50 56 L28 68 Z" fill="url(#goldGrad)" />
  <circle cx="50" cy="56" r="4" fill="#07090d" />
</svg>
